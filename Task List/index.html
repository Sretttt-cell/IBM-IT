<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind custom config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                blue: "#1D4ED8",
                "blue-light": "#3B82F6",
                "blue-pale": "#EFF6FF",
                orange: "#F97316",
                "orange-light": "#FDBA74",
              },
            },
            boxShadow: {
              card: "0 4px 24px 0 rgba(30,58,138,0.08)",
              "card-hover": "0 8px 32px 0 rgba(30,58,138,0.14)",
            },
          },
        },
      };
    </script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-gradient-to-br from-brand-blue-pale via-white to-blue-50 min-h-screen flex items-start justify-center pt-10 pb-16 px-4">

    <!-- ===== APP WRAPPER ===== -->
    <main class="w-full max-w-lg" role="main">

      <!-- ── Header ── -->
      <header class="mb-8 text-center">
        <div class="inline-flex items-center gap-2 mb-1">
          <!-- Checkmark icon (inline SVG) -->
          <svg class="w-8 h-8 text-brand-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="4" fill="#1D4ED8" stroke="none"/>
            <path d="M7 12.5l3.5 3.5 6-7" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1 class="text-3xl font-extrabold text-brand-blue tracking-tight">Task List</h1>
        </div>
        <p class="text-sm text-gray-400 font-medium mt-1">Stay organised, stay productive.</p>
      </header>

      <!-- ── Card container ── -->
      <section class="bg-white rounded-2xl shadow-card p-6 sm:p-8" aria-label="Task manager">

        <!-- ── Add task form ── -->
        <form id="task-form" class="flex gap-2 mb-6" aria-label="Add new task" novalidate>
          <label for="task-input" class="sr-only">New task</label>
          <input
            id="task-input"
            type="text"
            placeholder="Add a new task…"
            maxlength="120"
            autocomplete="off"
            class="flex-1 rounded-xl border border-gray-200 bg-gray-50 px-4 py-2.5 text-sm text-gray-700 placeholder-gray-400 outline-none transition focus:border-brand-blue-light focus:ring-2 focus:ring-blue-100"
            aria-required="true"
          />
          <button
            type="submit"
            class="btn-add flex items-center gap-1.5 rounded-xl bg-brand-blue px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-blue-light active:scale-95 focus:outline-none focus:ring-2 focus:ring-brand-blue-light focus:ring-offset-2"
            aria-label="Add task"
          >
            <!-- Plus icon -->
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
            </svg>
            Add
          </button>
        </form>

        <!-- ── Error message (hidden by default) ── -->
        <p id="error-msg" class="hidden -mt-3 mb-4 text-xs text-red-500 font-medium pl-1" role="alert" aria-live="polite">
          Please enter a task before adding.
        </p>

        <!-- ── Filter tabs ── -->
        <div class="flex gap-1 mb-5 bg-gray-50 rounded-xl p-1" role="tablist" aria-label="Filter tasks">
          <button
            data-filter="all"
            role="tab"
            aria-selected="true"
            class="filter-btn active-filter flex-1 rounded-lg py-1.5 text-xs font-semibold transition"
          >All</button>
          <button
            data-filter="active"
            role="tab"
            aria-selected="false"
            class="filter-btn flex-1 rounded-lg py-1.5 text-xs font-semibold transition"
          >Active</button>
          <button
            data-filter="completed"
            role="tab"
            aria-selected="false"
            class="filter-btn flex-1 rounded-lg py-1.5 text-xs font-semibold transition"
          >Completed</button>
        </div>

        <!-- ── Task list ── -->
        <ul id="task-list" class="space-y-2.5" role="list" aria-label="Task items" aria-live="polite"></ul>

        <!-- ── Empty state ── -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center">
          <svg class="w-12 h-12 text-blue-100 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="text-sm font-semibold text-gray-300" id="empty-label">No tasks yet. Add one above!</p>
        </div>

        <!-- ── Footer summary + clear completed ── -->
        <footer class="mt-5 flex items-center justify-between border-t border-gray-100 pt-4" id="task-footer">
          <span id="task-counter" class="text-xs text-gray-400 font-medium" aria-live="polite"></span>
          <button
            id="clear-completed"
            class="hidden text-xs font-semibold text-brand-orange hover:text-orange-600 transition focus:outline-none"
            aria-label="Clear all completed tasks"
          >
            Clear completed
          </button>
        </footer>

      </section><!-- /card -->
    </main><!-- /main -->

    <!-- ===== Edit modal ===== -->
    <div
      id="edit-modal"
      class="modal-overlay hidden fixed inset-0 z-50 flex items-center justify-center bg-black/30 px-4"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-card bg-white rounded-2xl shadow-card-hover w-full max-w-sm p-6">
        <h2 id="modal-title" class="text-base font-bold text-gray-800 mb-4">Edit Task</h2>
        <label for="edit-input" class="sr-only">Edit task text</label>
        <input
          id="edit-input"
          type="text"
          maxlength="120"
          class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-2.5 text-sm text-gray-700 outline-none transition focus:border-brand-blue-light focus:ring-2 focus:ring-blue-100 mb-4"
        />
        <div class="flex gap-2 justify-end">
          <button
            id="modal-cancel"
            class="rounded-xl border border-gray-200 px-4 py-2 text-sm font-semibold text-gray-500 hover:bg-gray-50 transition focus:outline-none"
          >Cancel</button>
          <button
            id="modal-save"
            class="rounded-xl bg-brand-blue px-4 py-2 text-sm font-semibold text-white hover:bg-brand-blue-light transition focus:outline-none focus:ring-2 focus:ring-brand-blue-light focus:ring-offset-1"
          >Save</button>
        </div>
      </div>
    </div>

    <!-- Main script -->
    <script src="script.js"></script>
  </body>
</html>
